[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forestfusion"
version = "0.1.0"
description = "Deep learning for forest lidar: tree segmentation, multimodal species classification and edge deployment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "laspy[lazrs]>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
edge = ["onnx>=1.15", "onnxruntime>=1.17"]
viz = ["matplotlib>=3.8", "open3d>=0.18"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
ff-train-seg = "forestfusion.train_seg:main"
ff-train-species = "forestfusion.train_species:main"
ff-export = "forestfusion.export:main"
ff-bench = "forestfusion.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]  # zip() without strict= is intentional in a few places

[tool.pytest.ini_options]
testpaths = ["tests"]
